<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: Arial;
        margin: 0;
        background: #f4f6f9;
        display: flex;
        flex-direction: column;
      }

      .navbar {
        background: #222;
        color: white;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar h2 {
        margin: 0;
        font-size: 18px;
      }

      .logout-btn {
        background: #dc3545;
        border: none;
        padding: 8px 14px;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        max-width: 200px;
      }

      .logout-btn:hover {
        background: #b02a37;
      }

      .container {
        flex: 1;
        width: 95%;
        max-width: 1400px;
        margin: 20px auto;
        padding: 20px;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 100%;
      }

      @media (max-width: 768px) {
        .admin-grid {
          grid-template-columns: 1fr;
        }
      }

      .user-card {
        max-height: 425px;
        overflow-y: auto;
      }

      .user-card ul {
        padding-right: 5px;
      }

      canvas {
        width: 100% !important;
        margin-top: 20px;
      }

      h3 {
        margin-top: 30px;
      }

      .card {
        background: #fff;
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      input,
      select,
      button {
        padding: 10px;
        margin: 5px 0;
        width: 100%;
        border-radius: 6px;
        border: 1px solid #ccc;
      }

      button {
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      ul li {
        background: #f5f5f5;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
      }

      .footer {
        padding: 15px;
        text-align: center;
        background: #222;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <div id="welcomeText"></div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="container">
      <!-- ADMIN -->
      <div id="adminUI" style="display: none">
        <div style="text-align: center; margin-bottom: 20px">
          <button onclick="loadData()" style="max-width: 250px">
            Refresh Data
          </button>
        </div>

        <div class="admin-grid">
          <div class="card user-card">
            <h3>Manajemen User</h3>
            <ul id="userList"></ul>
          </div>

          <div class="card">
            <h3>Okupansi Lapangan</h3>
            <canvas id="okupansiChart"></canvas>
          </div>

          <div class="card">
            <h3>Peak Hour</h3>
            <canvas id="peakChart"></canvas>
          </div>

          <div class="card">
            <h3>Pembatalan</h3>
            <canvas id="cancelChart"></canvas>
          </div>
        </div>
      </div>

      <!-- MEMBER -->
      <div id="memberUI" style="display: none">
        <div class="card">
          <h3>Booking Lapangan</h3>

          <input id="lapangan_id" placeholder="ID Lapangan" />
          <input type="date" id="tanggal" />
          <input
            type="time"
            id="jam_mulai"
            min="08:00"
            max="22:00"
            step="3600" />
          <input
            type="time"
            id="jam_selesai"
            min="08:00"
            max="22:00"
            step="3600" />

          <button onclick="booking()">Booking</button>
        </div>

        <div class="card">
          <h3>Booking Saya</h3>
          <ul id="myBooking"></ul>
        </div>
      </div>

      <!-- OPERATOR -->
      <div id="operatorUI" style="display: none">
        <div class="card">
          <h3>Manajemen Sesi</h3>
          <ul id="allSesi"></ul>
        </div>
      </div>
    </div>
    <div class="footer">©2026 Sistem Booking Lapangan | By Arya</div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      let okupansiChart, peakChart, cancelChart;

      // logout
      function logout() {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }

      // token
      const token = localStorage.getItem("token");

      if (!token) {
        window.location.href = "index.html";
      }

      const payload = JSON.parse(atob(token.split(".")[1]));
      const role = payload.role;

      loadWelcome();

      // welcome teks
      function loadWelcome() {
        const username = payload.username;
        const roleUser = payload.role;

        document.getElementById("welcomeText").innerHTML = `
          <div style="text-align:left;">
            <div style="font-weight:bold; font-size:18px;">
              Selamat datang ${username}!
            </div>
            <div style="margin-top:4px; color:#fff;">
              Level: ${roleUser}
            </div>
          </div>
        `;
      }

      // function

      function loadAdmin() {
        loadData();
        loadUsers();
      }

      // member
      async function loadMember() {
        document.getElementById("memberUI").style.display = "block";

        try {
          const res = await fetch("http://localhost:3000/api/jadwal/my", {
            headers: { Authorization: token },
          });

          if (!res.ok) throw new Error("Gagal load booking");

          const data = await res.json();

          const el = document.getElementById("myBooking");

          el.innerHTML = data
            .map(
              (x) => `
  <li>
    ${formatTanggal(x.tanggal)} 
    ${formatJam(x.jam_mulai)} - ${formatJam(x.jam_selesai)}
    
    <b style="
      color:
        ${
          x.status === "done"
            ? "green"
            : x.status === "ongoing"
              ? "orange"
              : x.status === "cancelled"
                ? "red"
                : "black"
        }
    ">
      ${x.status}
    </b>

    ${
      x.status === "booked"
        ? `<button onclick="cancel(${x.id})">Cancel</button>`
        : ""
    }
  </li>
`,
            )
            .join("");
        } catch (err) {
          alert(err.message);
        }
      }
      // operator
      async function loadOperator() {
        document.getElementById("operatorUI").style.display = "block";

        try {
          const res = await fetch("http://localhost:3000/api/jadwal/all", {
            headers: { Authorization: token },
          });

          if (!res.ok) throw new Error("Gagal load sesi");

          const data = await res.json();

          const el = document.getElementById("allSesi");

          el.innerHTML = data
            .map(
              (x) => `
<li>
  <b>User:</b> ${x.username}<br>

  ${formatTanggal(x.tanggal)}
  ${formatJam(x.jam_mulai)} - ${formatJam(x.jam_selesai)}

  <b style="
    color:
      ${
        x.status === "done"
          ? "green"
          : x.status === "ongoing"
            ? "orange"
            : x.status === "cancelled"
              ? "red"
              : "black"
      }
  ">
    ${x.status}
  </b>

  ${
    x.status === "booked"
      ? `<button onclick="start(${x.id})">Start</button>`
      : ""
  }

  ${
    x.status === "ongoing"
      ? `<button onclick="done(${x.id})">Done</button>`
      : ""
  }
</li>
`,
            )
            .join("");
        } catch (err) {
          alert(err.message);
        }
      }

      // role
      if (role === "admin") {
        document.getElementById("adminUI").style.display = "block";
        loadAdmin();
      } else if (role === "member") {
        loadMember();
      } else if (role === "operator") {
        loadOperator();
      }

      // admin
      async function loadData() {
        const okupansi = await fetch(
          "http://localhost:3000/api/jadwal/okupansi",
        ).then((r) => r.json());
        const peak = await fetch(
          "http://localhost:3000/api/jadwal/peak-hour",
        ).then((r) => r.json());
        const cancel = await fetch(
          "http://localhost:3000/api/jadwal/pembatalan",
        ).then((r) => r.json());

        if (okupansiChart) okupansiChart.destroy();
        if (peakChart) peakChart.destroy();
        if (cancelChart) cancelChart.destroy();

        okupansiChart = new Chart(document.getElementById("okupansiChart"), {
          type: "bar",
          data: {
            labels: okupansi.map((x) => "Lapangan " + x.lapangan_id),
            datasets: [{ data: okupansi.map((x) => x.total) }],
          },
        });

        peakChart = new Chart(document.getElementById("peakChart"), {
          type: "bar",
          data: {
            labels: peak.map((x) => x.jam_mulai),
            datasets: [{ data: peak.map((x) => x.total) }],
          },
        });

        cancelChart = new Chart(document.getElementById("cancelChart"), {
          type: "line",
          data: {
            labels: cancel.map((x) => x.tanggal),
            datasets: [{ data: cancel.map((x) => x.total) }],
          },
        });
      }

      // users
      async function loadUsers() {
        try {
          const res = await fetch("http://localhost:3000/api/users", {
            headers: { Authorization: token },
          });

          if (!res.ok) throw new Error("Gagal load user");

          const data = await res.json();

          const el = document.getElementById("userList");

          el.innerHTML = data
            .map(
              (x) => `
      <li>
        ${x.username} - ${x.role}
        <select onchange="ubahRole(${x.id}, this.value)">
          <option value="member" ${x.role === "member" ? "selected" : ""}>member</option>
          <option value="operator" ${x.role === "operator" ? "selected" : ""}>operator</option>
          <option value="admin" ${x.role === "admin" ? "selected" : ""}>admin</option>
        </select>
      </li>
    `,
            )
            .join("");
        } catch (err) {
          alert(err.message);
        }
      }

      // booking
      async function booking() {
        try {
          const res = await fetch("http://localhost:3000/api/jadwal", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: token,
            },
            body: JSON.stringify({
              lapangan_id: parseInt(
                document.getElementById("lapangan_id").value,
              ),
              tanggal: document.getElementById("tanggal").value,
              jam_mulai: document.getElementById("jam_mulai").value,
              jam_selesai: document.getElementById("jam_selesai").value,
            }),
          });

          const result = await res.json();

          if (!res.ok) {
            alert(result.message || "Booking gagal");
            return;
          }

          alert("Booking berhasil");

          loadMember();
          loadData();
        } catch (err) {
          alert("Terjadi error");
          console.log(err);
        }
      }

      // cancel, start, done
      async function cancel(id) {
        try {
          const res = await fetch(
            `http://localhost:3000/api/jadwal/cancel/${id}`,
            {
              method: "PUT",
              headers: { Authorization: token },
            },
          );

          if (!res.ok) {
            const msg = await res.text();
            alert("Cancel gagal: " + msg);
            return;
          }

          alert("Berhasil cancel");
          loadMember();
        } catch (err) {
          console.log(err);
          alert("Error cancel");
        }
      }

      async function start(id) {
        try {
          const res = await fetch(
            `http://localhost:3000/api/jadwal/start/${id}`,
            {
              method: "PUT",
              headers: { Authorization: token },
            },
          );

          if (!res.ok) {
            const msg = await res.text();
            alert("Start gagal: " + msg);
            return;
          }

          alert("Sesi dimulai");
          loadOperator();
        } catch (err) {
          console.log(err);
          alert("Error start");
        }
      }

      async function done(id) {
        try {
          const res = await fetch(
            `http://localhost:3000/api/jadwal/done/${id}`,
            {
              method: "PUT",
              headers: { Authorization: token },
            },
          );

          if (!res.ok) {
            const msg = await res.text();
            alert("Done gagal: " + msg);
            return;
          }

          alert("Sesi selesai");
          loadOperator();
        } catch (err) {
          console.log(err);
          alert("Error done");
        }
      }

      // format tanggal
      function formatTanggal(tanggal) {
        const d = new Date(tanggal);

        const hari = String(d.getDate()).padStart(2, "0");
        const bulan = String(d.getMonth() + 1).padStart(2, "0");
        const tahun = d.getFullYear();

        return `${hari}/${bulan}/${tahun}`;
      }

      function formatJam(jam) {
        return jam.substring(0, 5);
      }
    </script>
  </body>
</html>
