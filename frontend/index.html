<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Booking</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* CARD */
.card {
  background: white;
  padding: 30px;
  width: 100%;
  max-width: 350px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  animation: fadeIn 0.5s ease;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* INPUT */
.input-group {
  margin-bottom: 15px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  outline: none;
  transition: 0.2s;
}

.input-group input:focus {
  border-color: #4facfe;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #4facfe;
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #3a8ee6;
}

/* MESSAGE */
#msg {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  color: red;
}

/* ANIMASI */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE FIX */
@media (max-width: 400px) {
  .card {
    margin: 10px;
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="card">
  <h2>Login</h2>

  <div class="input-group">
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button onclick="login()">Login</button>

  <button onclick="goRegister()" style="margin-top:10px;background:#28a745;">
    Register
  </button>

  <p id="msg"></p>
</div>

<script>
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    document.getElementById('msg').innerText = "Isi semua field!";
    return;
  }

  try {
    const res = await fetch('http://localhost:3000/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (!res.ok) {
      document.getElementById('msg').innerText = "Username / Password salah";
      return;
    }

    const data = await res.json();
    localStorage.setItem('token', data.token);

    window.location.href = 'dashboard.html';

  } catch (err) {
    document.getElementById('msg').innerText = "Server tidak terhubung";
  }
}

function goRegister() {
  window.location.href = 'register.html';
}
</script>

</body>
</html>
